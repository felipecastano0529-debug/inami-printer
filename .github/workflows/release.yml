# Compila Inami Printer para macOS (arm64 + x64) y Windows (x64) y publica los
# instaladores como release de ESTE repo, que es público: el equipo del local
# descarga sin cuenta de GitHub.
#
# Antes publicaba en otro repo (`impresion-`) con un Personal Access Token,
# porque el código vivía en un repo privado y los releases tenían que salir a
# uno público. Este repo YA es público, así que sobra el rodeo y sobra el
# token: basta el GITHUB_TOKEN que Actions inyecta solo.
#
# Cómo se usa:
#   1. Sube la versión en package.json si toca.
#   2. Actions → "Release Printer" → Run workflow, con el tag (ej. v0.5.3).
#   3. Compila los 3 instaladores y los sube al release. Al terminar ya se
#      descargan desde /app → App impresora.

name: Release Printer

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag del release (ej. v0.5.3)"
        required: true
        default: "v0.5.2"
      release_notes:
        description: "Notas del release (opcional)"
        required: false
        default: "Build automático"

permissions:
  contents: write   # crear el release y subirle los binarios, en este mismo repo

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14         # arm64 nativo
            arch: arm64
            target: dmg
          - os: macos-13         # intel
            arch: x64
            target: dmg
          - os: windows-latest
            arch: x64
            target: nsis
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install deps
        run: npm ci

      - name: Build TS + renderer
        run: npm run build

      - name: Package (electron-builder)
        # bash explícito porque en Windows el default es PowerShell y
        # no parsea bien los backslashes ni los condicionales inline.
        shell: bash
        env:
          # Sin firma — clientes verán warning de SmartScreen / Gatekeeper
          # pero la app se ejecuta. Cuando consigamos certs, agregar
          # CSC_LINK / CSC_KEY_PASSWORD (mac) y WIN_CSC_LINK (win).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx electron-builder \
            --${{ runner.os == 'Windows' && 'win' || 'mac' }} \
            --${{ matrix.arch }} \
            --publish never

      - name: Crear el release si no existe
        # Solo lo intenta el primer job (mac arm64) — los siguientes
        # encuentran el release ya creado y solo suben sus assets.
        if: matrix.arch == 'arm64' && runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ inputs.tag }}"
          NOTES="${{ inputs.release_notes }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG ya existe — saltando creación."
          else
            echo "Creando release $TAG…"
            gh release create "$TAG" \
              \
              --title "Inami Printer ${TAG#v}" \
              --notes "$NOTES"
          fi

      - name: Rename binarios a nombres estables (sin versión)
        # Los empleados descargan vía /releases/latest/download/<file> que
        # apunta al último release. Para que la URL sea fija usamos nombres
        # SIN número de versión: Inami-Printer-arm64.dmg, etc.
        shell: bash
        run: |
          cd release
          ls -la
          if [ "${{ runner.os }}" = "Windows" ]; then
            for f in *.exe; do
              [ -e "$f" ] && mv "$f" "Inami-Printer-${{ matrix.arch }}.exe" || true
            done
          else
            for f in *.dmg; do
              [ -e "$f" ] && mv "$f" "Inami-Printer-${{ matrix.arch }}.dmg" || true
            done
          fi
          ls -la

      - name: Wait for release to exist (jobs paralelos)
        # Los jobs corren en paralelo; el job de mac-arm64 crea el release.
        # Los demás esperan hasta que aparezca antes de subir su asset.
        if: matrix.arch != 'arm64' || runner.os != 'macOS'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ inputs.tag }}"
          for i in {1..30}; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG listo."; exit 0
            fi
            echo "Esperando release… ($i/30)"; sleep 10
          done
          echo "::error::Release no apareció a tiempo"; exit 1

      - name: Subir los instaladores al release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          cd release
          if [ "${{ runner.os }}" = "Windows" ]; then
            FILES=$(ls *.exe 2>/dev/null || true)
          else
            FILES=$(ls *.dmg 2>/dev/null || true)
          fi
          if [ -z "$FILES" ]; then
            echo "::error::No se encontraron instaladores para subir"; exit 1
          fi
          for f in $FILES; do
            echo "Subiendo $f a ${{ inputs.tag }}…"
            gh release upload "${{ inputs.tag }}" "$f" \
              --clobber
          done
