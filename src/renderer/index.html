<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inami Printer</title>
    <style>
      :root {
        --bg: #0b0d12;
        --panel: #161922;
        --border: #232733;
